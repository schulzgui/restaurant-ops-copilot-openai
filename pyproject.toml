[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "restaurant-ops-copilot"
version = "1.0.0"
description = "OpenAI-powered restaurant operations copilot with supervised actions"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
[project.scripts]
ops-copilot = "ops_copilot.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
ops_copilot = ["static/*"]
