name: Contracts, security and integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: PYTHONPATH=src python scripts/generate_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: contract-evidence-${{ matrix.python }}
          path: artifacts/contract-evaluation.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t restaurant-ops-copilot .
